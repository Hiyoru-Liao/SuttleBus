<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuttle Bus Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --m-black: #000000;
            --m-gold: #b4975a;
            --m-white: #ffffff;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--m-white);
            font-family: "Effra", "Noto Sans JP", sans-serif;
        }

        /* --- 管理画面レイアウト --- */
        .admin-container {
            padding: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--m-gold);
            padding-bottom: 20px;
        }

        button {
            background: var(--m-gold);
            color: black;
            border: none;
            padding: 12px 28px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            font-size: 15px;
            transition: 0.3s;
        }
        button:hover { opacity: 0.8; transform: translateY(-2px); }

        /* 次の便カード表示 */
        .next-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        .info-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border-left: 6px solid var(--m-gold);
            text-align: center;
        }
        .info-card h2 { margin: 0; font-size: 1.2rem; color: var(--m-gold); }
        .info-card .time-val { font-size: 3.5rem; font-weight: bold; margin: 10px 0; }

        /* 時刻表入力エリア */
        .schedule-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .day-group {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
        }
        .day-group h3 {
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            color: var(--m-gold);
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #2a2a2a;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
            margin-top: 10px;
        }

        /* --- 全画面表示 (Guest Mode) --- */
        #fullscreen-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--m-black);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .fs-label { 
            font-size: 6rem; 
            font-weight: bold;
            color: var(--m-gold);
            margin: 0;
            /* 文字外枠 */
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 20px rgba(180,151,90,0.4);
        }
        .fs-next-time { 
            font-size: 24rem; 
            font-weight: bold; 
            line-height: 0.9; 
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        .fs-eta { font-size: 5rem; font-weight: normal; }

        .fs-footer {
            position: absolute;
            bottom: 40px; left: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .fs-logo { width: 50px; opacity: 0.8; }
        .fs-clock { font-size: 2.5rem; opacity: 0.7; }

        /* --- エレガントな時刻表表示 --- */
        #schedule-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            z-index: 2100;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 120px 60px 60px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .tile {
            padding: 25px 10px;
            border: 2px solid var(--m-gold);
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            border-radius: 100px; /* 楕円形 */
            transition: 0.3s;
        }
        .tile.passed { opacity: 0.2; border-color: #333; }

        #pip-canvas { display: none; }
        #pip-video { display: none; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="top-nav">
        <h1 style="font-size: 1.5rem;">Shuttle Bus Control</h1>
        <div style="display:flex; gap:15px; align-items:center;">
            <div style="background:rgba(255,255,255,0.1); padding:5px 15px; border-radius:20px;">
                <label>祝日モード</label>
                <input type="checkbox" id="isHoliday">
            </div>
            <button onclick="startPiP()">最前面表示</button>
            <button onclick="enterFullScreen()">全画面表示</button>
        </div>
    </div>

    <div class="next-info-grid">
        <div class="info-card">
            <h2>ホテル発 (Next Hotel)</h2>
            <div id="adm-h-time" class="time-val">--:--</div>
        </div>
        <div class="info-card">
            <h2>品川駅発 (Next Shinagawa)</h2>
            <div id="adm-s-time" class="time-val">--:--</div>
        </div>
    </div>

    <div class="schedule-section">
        <div class="day-group">
            <h3>【平日ダイヤ】</h3>
            <label>ホテル発</label>
            <textarea id="h_wkday">08:00, 08:30, 09:00, 10:00, 11:00, 13:00, 15:00, 17:00, 18:00, 19:00, 20:00, 21:00, 22:00</textarea>
            <label>品川駅発</label>
            <textarea id="s_wkday">08:15, 08:45, 09:15, 10:15, 11:15, 13:15, 15:15, 17:15, 18:15, 19:15, 20:15, 21:15, 22:15</textarea>
        </div>
        <div class="day-group">
            <h3>【土日祝ダイヤ】</h3>
            <label>ホテル発</label>
            <textarea id="h_weekend">08:00, 09:00, 10:00, 11:00, 12:00, 13:00, 14:00, 15:00, 16:00, 17:00, 18:00, 19:00, 20:00, 21:00, 22:00, 23:00</textarea>
            <label>品川駅発</label>
            <textarea id="s_weekend">08:20, 09:20, 10:20, 11:20, 12:20, 13:20, 14:20, 15:20, 16:20, 17:20, 18:20, 19:20, 20:20, 21:20, 22:20, 23:20</textarea>
        </div>
    </div>
</div>

<div id="fullscreen-view" ondblclick="exitFullScreen()">
    <p class="fs-label">Next Shuttle Bus</p>
    <h1 id="fs-time" class="fs-next-time">--:--</h1>
    <p id="fs-eta" class="fs-eta">-- min left</p>

    <div class="fs-footer">
        <svg class="fs-logo" viewBox="0 0 100 100" fill="#b4975a"><rect width="100" height="100" rx="10"/></svg>
        <div id="fs-clock" class="fs-clock">00:00:00</div>
    </div>
</div>

<div id="schedule-overlay"></div>

<canvas id="pip-canvas" width="400" height="250"></canvas>
<video id="pip-video" autoplay playsinline muted></video>

<script>
    function getTimes(id) {
        return document.getElementById(id).value.split(',').map(s => s.trim()).filter(s => s !== "");
    }

    function findNext(times) {
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const next = times.find(t => {
            const [h, m] = t.split(':').map(Number);
            return (h * 60 + m) > nowMin;
        });
        if (!next) return { time: "終便出発済み", eta: null };
        const [nh, nm] = next.split(':').map(Number);
        return { time: next, eta: (nh * 60 + nm) - nowMin };
    }

    function update() {
        const now = new Date();
        const isWeekend = (now.getDay() === 0 || now.getDay() === 6 || document.getElementById('isHoliday').checked);
        
        const hTimes = isWeekend ? getTimes('h_weekend') : getTimes('h_wkday');
        const sTimes = isWeekend ? getTimes('s_weekend') : getTimes('s_wkday');

        const nH = findNext(hTimes);
        const nS = findNext(sTimes);

        // 管理画面更新
        document.getElementById('adm-h-time').innerText = nH.time;
        document.getElementById('adm-s-time').innerText = nS.time;

        // 全画面更新
        document.getElementById('fs-time').innerText = nH.time;
        document.getElementById('fs-eta').innerText = nH.eta !== null ? `${nH.eta} min left` : "";
        document.getElementById('fs-clock').innerText = now.toLocaleTimeString('ja-JP', { hour12: false });

        updatePiP(nH.time, nH.eta);
    }

    function enterFullScreen() {
        const el = document.getElementById('fullscreen-view');
        el.style.display = 'flex';
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }

    function exitFullScreen() {
        document.getElementById('fullscreen-view').style.display = 'none';
        if (document.fullscreenElement) document.exitFullscreen();
    }

    // 全画面終了時に管理画面に戻るための監視
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            document.getElementById('fullscreen-view').style.display = 'none';
            document.getElementById('schedule-overlay').style.display = 'none';
        }
    });

    document.getElementById('fullscreen-view').addEventListener('click', (e) => {
        const overlay = document.getElementById('schedule-overlay');
        overlay.innerHTML = '';
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const isWeekend = (now.getDay() === 0 || now.getDay() === 6 || document.getElementById('isHoliday').checked);
        const hTimes = isWeekend ? getTimes('h_weekend') : getTimes('h_wkday');

        hTimes.forEach(t => {
            const [h, m] = t.split(':').map(Number);
            const div = document.createElement('div');
            div.className = `tile ${(h * 60 + m) <= nowMin ? 'passed' : ''}`;
            div.innerText = t;
            overlay.appendChild(div);
        });
        overlay.style.display = 'grid';
    });

    document.getElementById('schedule-overlay').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('schedule-overlay').style.display = 'none';
    });

    // PiP (子画面) - 余計な文字を削除
    async function startPiP() {
        const video = document.getElementById('pip-video');
        const canvas = document.getElementById('pip-canvas');
        video.srcObject = canvas.captureStream();
        await video.play();
        await video.requestPictureInPicture();
    }

    function updatePiP(time, eta) {
        const canvas = document.getElementById('pip-canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#b4975a";
        ctx.font = "bold 90px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(time, 200, 120);
        ctx.fillStyle = "white";
        ctx.font = "40px sans-serif";
        ctx.fillText(eta !== null ? `${eta} min` : "", 200, 200);
    }

    setInterval(update, 1000);
    window.onload = update;
</script>
</body>
</html>
