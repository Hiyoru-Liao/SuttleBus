<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuttle Bus Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --marriott-black: #000000;
            --marriott-gold: #b4975a;
            --text-white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--marriott-black);
            color: var(--text-white);
            font-family: "Effra", "Noto Sans JP", sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* --- ヘッダー・操作系 --- */
        .controls {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }

        button {
            background: var(--marriott-gold);
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .holiday-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* --- メイン表示エリア --- */
        #display-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .label { font-size: 2rem; margin-bottom: 10px; color: var(--marriott-gold); }
        .next-bus-time { font-size: 12rem; font-weight: bold; line-height: 1; }
        .remaining-time { font-size: 3rem; margin-top: 20px; opacity: 0.8; }

        /* --- ロゴと現在時刻 --- */
        .footer-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo { width: 40px; height: auto; opacity: 0.8; }
        #current-time { font-size: 1.2rem; }

        /* --- 時刻表タイル表示 --- */
        #schedule-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            padding: 80px 40px 40px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 50;
        }

        .tile {
            padding: 15px;
            border: 1px solid var(--marriott-gold);
            text-align: center;
            font-size: 1.5rem;
        }

        .tile.passed { opacity: 0.3; border-color: #444; }

        /* 子画面モード用スタイル */
        .pip-mode .next-bus-time { font-size: 4rem; }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="togglePIP()">最前面表示 (PiP)</button>
        <button onclick="toggleFullScreen()">全画面表示</button>
        <div class="holiday-toggle">
            <label>今日は祝日ですか？</label>
            <input type="checkbox" id="holiday-chk" onchange="updateDisplay()">
        </div>
    </div>

    <div id="display-container" onclick="toggleSchedule()">
        <div id="route-label" class="label">ホテル発 次の便</div>
        <div id="next-time" class="next-bus-time">--:--</div>
        <div id="eta" class="remaining-time">あと -- 分</div>
    </div>

    <div id="schedule-overlay" onclick="toggleSchedule()">
        </div>

    <div class="footer-info">
        <svg class="logo" viewBox="0 0 100 100" fill="white"><rect width="100" height="100" rx="10"/></svg>
        <div id="current-time">00:00:00</div>
    </div>

    <video id="pip-video" style="display:none;" autoplay playsinline></video>
    <canvas id="pip-canvas" width="400" height="250" style="display:none;"></canvas>

<script>
    // --- 時刻表データ設定 ---
    const schedule = {
        weekday: {
            hotel: ["08:00", "08:30", "09:00", "09:30", "10:00", "11:00", "13:00", "15:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00"],
            station: ["08:15", "08:45", "09:15", "09:45", "10:15", "11:15", "13:15", "15:15", "17:15", "18:15", "19:15", "20:15", "21:15", "22:15"]
        },
        weekend: {
            hotel: ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"],
            station: ["08:20", "09:20", "10:20", "11:20", "12:20", "13:20", "14:20", "15:20", "16:20", "17:20", "18:20", "19:20", "20:20", "21:20", "22:20", "23:20"]
        }
    };

    function getCurrentSchedule() {
        const now = new Date();
        const day = now.getDay();
        const isHoliday = document.getElementById('holiday-chk').checked;
        const isWeekend = (day === 0 || day === 6 || isHoliday);
        return isWeekend ? schedule.weekend : schedule.weekday;
    }

    function updateDisplay() {
        const now = new Date();
        const currentTimeStr = now.toTimeString().substring(0, 8);
        document.getElementById('current-time').innerText = currentTimeStr;

        const currentSched = getCurrentSchedule();
        const hotelTimes = currentSched.hotel;
        
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        let nextBus = null;

        for (let time of hotelTimes) {
            const [h, m] = time.split(':').map(Number);
            if ((h * 60 + m) > nowMinutes) {
                nextBus = time;
                break;
            }
        }

        const timeDisplay = document.getElementById('next-time');
        const etaDisplay = document.getElementById('eta');

        if (nextBus) {
            timeDisplay.innerText = nextBus;
            const [nh, nm] = nextBus.split(':').map(Number);
            const diff = (nh * 60 + nm) - nowMinutes;
            etaDisplay.innerText = `あと ${diff} 分`;
        } else {
            timeDisplay.innerText = "終便出発済み";
            etaDisplay.innerText = "翌日の始発をお待ちください";
        }
        
        updatePiPCanvas(timeDisplay.innerText, etaDisplay.innerText);
    }

    function toggleSchedule() {
        const overlay = document.getElementById('schedule-overlay');
        if (overlay.style.display === 'grid') {
            overlay.style.display = 'none';
        } else {
            overlay.innerHTML = '';
            const currentSched = getCurrentSchedule().hotel;
            const now = new Date();
            const nowMinutes = now.getHours() * 60 + now.getMinutes();

            currentSched.forEach(time => {
                const [h, m] = time.split(':').map(Number);
                const isPassed = (h * 60 + m) <= nowMinutes;
                const tile = document.createElement('div');
                tile.className = `tile ${isPassed ? 'passed' : ''}`;
                tile.innerText = time;
                overlay.appendChild(tile);
            });
            overlay.style.display = 'grid';
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }

    // --- Picture-in-Picture (最前面表示) 機能 ---
    async function togglePIP() {
        const video = document.getElementById('pip-video');
        const canvas = document.getElementById('pip-canvas');
        if (document.pictureInPictureElement) {
            document.exitPictureInPicture();
        } else {
            const stream = canvas.captureStream();
            video.srcObject = stream;
            video.play();
            await video.requestPictureInPicture();
        }
    }

    function updatePiPCanvas(time, eta) {
        const canvas = document.getElementById('pip-canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#b4975a";
        ctx.font = "bold 80px Arial";
        ctx.textAlign = "center";
        ctx.fillText(time, canvas.width/2, 120);
        ctx.font = "30px Arial";
        ctx.fillStyle = "white";
        ctx.fillText(eta, canvas.width/2, 180);
    }

    setInterval(updateDisplay, 1000);
    window.onload = updateDisplay;

    // Escキーで全画面終了
    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && document.fullscreenElement) {
            document.exitFullscreen();
        }
    });
</script>
</body>
</html>
