<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marriott Shuttle Bus Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --marriott-black: #000000;
            --marriott-gold: #b4975a;
            --text-white: #ffffff;
            --bg-gray: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-gray);
            color: var(--text-white);
            font-family: "Effra", "Noto Sans JP", sans-serif;
            overflow-x: hidden;
        }

        /* --- UI Controls --- */
        .admin-panel {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background: var(--marriott-gold);
            color: black;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }

        .inputs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #333;
            color: white;
            border: 1px solid var(--marriott-gold);
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
        }

        .status-bar {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 5px solid var(--marriott-gold);
        }

        /* --- Fullscreen Mode --- */
        #fullscreen-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--marriott-black);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .fs-label { font-size: 4rem; color: var(--marriott-gold); margin-bottom: 0; }
        .fs-next-time { font-size: 20rem; font-weight: bold; line-height: 1; margin: 0; }
        .fs-eta { font-size: 5rem; opacity: 0.9; }

        .fs-footer {
            position: absolute;
            bottom: 30px; left: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .fs-logo { width: 60px; height: 60px; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .fs-clock { font-size: 2rem; }

        /* --- Schedule Tiles --- */
        #schedule-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1100;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 100px 50px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .tile {
            padding: 20px;
            border: 1px solid var(--marriott-gold);
            text-align: center;
            font-size: 2rem;
            border-radius: 5px;
        }

        .tile.passed { opacity: 0.3; }

        /* Hidden Canvas for PiP */
        #pip-canvas { display: none; }
        #pip-video { display: none; }
    </style>
</head>
<body>

<div class="admin-panel">
    <div class="header-buttons">
        <button onclick="startPiP()">最前面表示 (子画面)</button>
        <button onclick="enterFullScreen()">全画面表示 (タブレット用)</button>
        <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
            <label>今日は祝日ですか？</label>
            <input type="checkbox" id="isHoliday" style="transform:scale(1.5);">
        </div>
    </div>

    <div class="status-bar">
        <div id="debug-info" style="font-size:1.2rem;">判定中...</div>
    </div>

    <div class="inputs-container">
        <div>
            <h3>ホテル発 (平日)</h3>
            <textarea id="h_wkday">08:00, 08:30, 09:00, 10:00, 11:00, 13:00, 15:00, 17:00, 18:00, 19:00, 20:00, 21:00, 22:00</textarea>
        </div>
        <div>
            <h3>品川駅発 (平日)</h3>
            <textarea id="s_wkday">08:15, 08:45, 09:15, 10:15, 11:15, 13:15, 15:15, 17:15, 18:15, 19:15, 20:15, 21:15, 22:15</textarea>
        </div>
        <div>
            <h3>ホテル発 (土日祝)</h3>
            <textarea id="h_weekend">08:00, 09:00, 10:00, 11:00, 12:00, 13:00, 14:00, 15:00, 16:00, 17:00, 18:00, 19:00, 20:00, 21:00, 22:00, 23:00</textarea>
        </div>
        <div>
            <h3>品川駅発 (土日祝)</h3>
            <textarea id="s_weekend">08:20, 09:20, 10:20, 11:20, 12:20, 13:20, 14:20, 15:20, 16:20, 17:20, 18:20, 19:20, 20:20, 21:20, 22:20, 23:20</textarea>
        </div>
    </div>
</div>

<div id="fullscreen-view" ondblclick="exitFullScreen()">
    <p class="fs-label">Next Shuttle Bus</p>
    <h1 id="fs-time" class="fs-next-time">--:--</h1>
    <p id="fs-eta" class="fs-eta">あと -- 分</p>

    <div class="fs-footer">
        <div class="fs-logo">M</div>
        <div id="fs-clock" class="fs-clock">00:00:00</div>
    </div>
</div>

<div id="schedule-overlay"></div>

<canvas id="pip-canvas" width="400" height="250"></canvas>
<video id="pip-video" autoplay playsinline muted></video>

<script>
    // --- Data Management ---
    function getScheduleList(id) {
        return document.getElementById(id).value.split(',').map(s => s.trim()).filter(s => s !== "");
    }

    function getNextBus(times) {
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        
        // 跨午夜処理 (全便チェック)
        let next = times.find(t => {
            const [h, m] = t.split(':').map(Number);
            return (h * 60 + m) > nowMin;
        });

        if (!next) return { time: "【終便出発済み】", eta: null, isNextDay: true };
        
        const [nh, nm] = next.split(':').map(Number);
        const diff = (nh * 60 + nm) - nowMin;
        return { time: next, eta: diff, isNextDay: false };
    }

    // --- Core Logic ---
    function update() {
        const now = new Date();
        const isWeekend = (now.getDay() === 0 || now.getDay() === 6 || document.getElementById('isHoliday').checked);
        const dayType = isWeekend ? "土日祝" : "平日";
        
        const hotelTimes = isWeekend ? getScheduleList('h_weekend') : getScheduleList('h_wkday');
        const stationTimes = isWeekend ? getScheduleList('s_weekend') : getScheduleList('s_wkday');

        const nextHotel = getNextBus(hotelTimes);
        const nextStation = getNextBus(stationTimes);

        // Update UI
        const debugInfo = `現在: ${now.toLocaleTimeString()} (${dayType}ダイヤ) | 次の品川駅発: ${nextStation.time}`;
        document.getElementById('debug-info').innerText = debugInfo;

        // Update Fullscreen
        document.getElementById('fs-time').innerText = nextHotel.time;
        document.getElementById('fs-eta').innerText = nextHotel.eta !== null ? `あと ${nextHotel.eta} 分` : "";
        document.getElementById('fs-clock').innerText = now.toLocaleTimeString('ja-JP', { hour12: false });

        updatePiP(nextHotel.time, nextHotel.eta);
    }

    // --- Fullscreen & Overlay Logic ---
    function enterFullScreen() {
        const view = document.getElementById('fullscreen-view');
        view.style.display = 'flex';
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }

    function exitFullScreen() {
        document.getElementById('fullscreen-view').style.display = 'none';
        if (document.fullscreenElement) document.exitFullscreen();
    }

    function toggleSchedule(e) {
        // 全画面モード時のみタップで時刻表表示
        if (document.getElementById('fullscreen-view').style.display !== 'flex') return;
        
        const overlay = document.getElementById('schedule-overlay');
        if (overlay.style.display === 'grid') {
            overlay.style.display = 'none';
        } else {
            overlay.innerHTML = '';
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const isWeekend = (now.getDay() === 0 || now.getDay() === 6 || document.getElementById('isHoliday').checked);
            const hotelTimes = isWeekend ? getScheduleList('h_weekend') : getScheduleList('h_wkday');

            hotelTimes.forEach(t => {
                const [h, m] = t.split(':').map(Number);
                const isPassed = (h * 60 + m) <= nowMin;
                const div = document.createElement('div');
                div.className = `tile ${isPassed ? 'passed' : ''}`;
                div.innerText = t;
                overlay.appendChild(div);
            });
            overlay.style.display = 'grid';
        }
    }

    // --- Picture-in-Picture (最前面) ---
    async function startPiP() {
        const video = document.getElementById('pip-video');
        const canvas = document.getElementById('pip-canvas');
        const stream = canvas.captureStream();
        video.srcObject = stream;
        await video.play();
        await video.requestPictureInPicture();
    }

    function updatePiP(time, eta) {
        const canvas = document.getElementById('pip-canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#b4975a";
        ctx.font = "bold 80px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(time, 200, 110);
        
        ctx.fillStyle = "white";
        ctx.font = "30px sans-serif";
        ctx.fillText(eta !== null ? `あと ${eta} 分` : "", 200, 180);
        
        ctx.font = "20px sans-serif";
        ctx.fillText("Marriott Shuttle", 200, 220);
    }

    // Event Listeners
    setInterval(update, 1000);
    document.getElementById('fullscreen-view').addEventListener('click', toggleSchedule);
    document.getElementById('schedule-overlay').addEventListener('click', () => {
        document.getElementById('schedule-overlay').style.display = 'none';
    });
    
    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") exitFullScreen();
    });

</script>
</body>
</html>
